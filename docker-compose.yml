services:
  backend:
    build: ./backend
    container_name: uptime-monitor-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    container_name: uptime-monitor-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
